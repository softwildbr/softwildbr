name: Verificar navegação principal
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_main_navigation.py'
      - 'scripts/check_mobile_navigation.py'
      - '.github/workflows/main-navigation-qa.yml'
permissions:
  contents: read
jobs:
  navegacao:
    name: Navegação principal (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install playwright==1.56.0
      - if: matrix.browser == 'webkit'
        run: python3 -m playwright install --with-deps webkit
      - run: python3 scripts/check_main_navigation.py --browser "${{ matrix.browser }}"
      - if: matrix.browser == 'chromium'
        run: python3 scripts/check_mobile_navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-menu-${{ matrix.browser }}
          path: menu-capturas/
