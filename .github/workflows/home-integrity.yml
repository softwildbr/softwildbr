name: Soft Wild - Integridade da Home

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  home-integrity:
    name: home-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Versão do Node
        run: node --version
      - name: Validar integridade do site
        run: node scripts/verify-home-locks.mjs
